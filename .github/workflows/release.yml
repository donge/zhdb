name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v0.1.0)
        required: true

permissions:
  contents: write

env:
  ZIG_VERSION: 0.17.0

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-linux-gnu
            name: linux-aarch64
          - os: macos-14
            target: aarch64-macos
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ICU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libicu-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build release binary
        run: zig build --release=fast -Dtarget=${{ matrix.target }}
      - name: Unit tests
        run: zig build test
      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/zhdb dist/zhdb
          cp README.md README.zh-CN.md LICENSE NOTICE dist/
          tar -C dist -czf "zhdb-${{ matrix.name }}.tar.gz" \
            zhdb README.md README.zh-CN.md LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: zhdb-${{ matrix.name }}
          path: zhdb-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
