name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  budget:
    name: Source budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Zig source stays under 50,000 lines
        run: |
          lines=$(wc -l src/*.zig | tail -1 | awk '{print $1}')
          echo "src/*.zig: ${lines} lines"
          if [ "$lines" -gt 50000 ]; then
            echo "::error::source budget exceeded: ${lines} > 50000"
            exit 1
          fi

  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ICU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libicu-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon', 'deps/zhdb-support/build.zig.zon') }}
      - name: Build
        run: zig build --release=fast
      - name: Unit tests
        run: zig build test

  regression:
    name: SQL regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ICU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libicu-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon', 'deps/zhdb-support/build.zig.zon') }}
      - name: Build
        run: zig build --release=fast
      - name: Internal suites
        run: ./test/run.sh
      - name: PostgreSQL 18.6 official regression
        run: PG18_JOBS=4 ./test/pg18/run.sh

  protocol:
    name: Wire protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ICU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libicu-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon', 'deps/zhdb-support/build.zig.zon') }}
      - name: Build
        run: zig build --release=fast
      - name: Start trust and SCRAM servers
        run: |
          ./zig-out/bin/zhdb serve --port=5432 > /tmp/zhdb-trust.log 2>&1 &
          echo $! > /tmp/zhdb-trust.pid
          ./zig-out/bin/zhdb serve --port=5433 --scram-sha-256 --password=postgres \
            > /tmp/zhdb-scram.log 2>&1 &
          echo $! > /tmp/zhdb-scram.pid
          for port in 5432 5433; do
            for _ in $(seq 1 100); do
              if (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; then break; fi
              sleep 0.1
            done
          done
      - name: Protocol probes
        run: |
          python3 tests/pg_catalog_test.py 5432
          python3 tests/pg_protocol_test.py 5432
          python3 tests/pg_extended_probe.py 5432
          python3 tests/pg_protocol_probe.py 5433 postgres
      - name: Server logs
        if: always()
        run: |
          echo '--- trust ---'; cat /tmp/zhdb-trust.log || true
          echo '--- scram ---'; cat /tmp/zhdb-scram.log || true
          kill "$(cat /tmp/zhdb-trust.pid)" 2>/dev/null || true
          kill "$(cat /tmp/zhdb-scram.pid)" 2>/dev/null || true
